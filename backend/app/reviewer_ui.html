<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      style-src 'unsafe-inline';
      script-src 'unsafe-inline';
      connect-src 'self';
      img-src 'self' data:;
      base-uri 'none';
      frame-ancestors 'none';
      form-action 'self'
    "
  />
  <title>Sportabase Reviewer</title>

  <style>
    :root {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color-scheme: dark;

      --bg: #07090d;
      --panel: #0d1118;
      --panel-2: #111722;
      --line: #242c3a;
      --muted: #8792a6;
      --text: #edf2f7;
      --accent: #78a9ff;
      --danger: #ff8080;
      --warning: #ffc66d;
      --success: #7ee2a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(13, 17, 24, 0.96);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand strong {
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select,
    input,
    textarea {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      outline: none;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
    }

    .toolbar button,
    .resolve-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 13px;
    }

    .resolve-button {
      background: var(--accent);
      color: #07101e;
      border-color: transparent;
      font-weight: 700;
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns:
        minmax(280px, 360px)
        minmax(0, 1fr);
    }

    .queue {
      border-right: 1px solid var(--line);
      padding: 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .queue-card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 13px;
      margin-bottom: 10px;
      background: var(--panel);
      color: var(--text);
    }

    .queue-card:hover,
    .queue-card.active {
      border-color: var(--accent);
    }

    .queue-card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .reason {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .priority {
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .auto {
      color: var(--muted);
      font-size: 13px;
    }

    .content {
      overflow-y: auto;
      padding: 24px;
      min-width: 0;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 26px;
    }

    .section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .section h2,
    .section h3 {
      margin-top: 0;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .claim {
      font-size: 23px;
      line-height: 1.35;
      font-weight: 700;
    }

    .meta-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );
      gap: 12px;
      margin-top: 16px;
    }

    .meta {
      background: var(--panel-2);
      border-radius: 8px;
      padding: 11px;
    }

    .meta-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .meta-value {
      overflow-wrap: anywhere;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #080b10;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      max-height: 420px;
      overflow-y: auto;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-control label {
      color: var(--muted);
      font-size: 12px;
    }

    .resolved {
      color: var(--success);
      font-weight: 700;
    }

    .error {
      color: var(--danger);
      white-space: pre-wrap;
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
      }

      .queue {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 320px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand">
        <strong>Sportabase Reviewer</strong>
        <span>
          Local adjudication review console
        </span>
      </div>

      <div class="toolbar">
        <select id="statusFilter">
          <option value="pending">
            Pending
          </option>
          <option value="resolved">
            Resolved
          </option>
          <option value="all">
            All
          </option>
        </select>

        <button id="refreshButton">
          Refresh
        </button>
      </div>
    </header>

    <main>
      <aside
        class="queue"
        id="queue"
      ></aside>

      <section
        class="content"
        id="content"
      >
        <div class="empty">
          Select a review item.
        </div>
      </section>
    </main>
  </div>

  <script>
    const REVIEW_TOKEN =
      __SPORTABASE_REVIEWER_TOKEN__;

    const queueEl =
      document.getElementById("queue");

    const contentEl =
      document.getElementById("content");

    const statusFilter =
      document.getElementById("statusFilter");

    const refreshButton =
      document.getElementById("refreshButton");

    let currentReviewId = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatValue(value) {
      if (
        value === null
        || value === undefined
        || value === ""
      ) {
        return "?";
      }

      return String(value);
    }

    async function api(path, options = {}) {
      const response =
        await fetch(path, options);

      const data =
        await response.json();

      if (!response.ok) {
        const detail =
          data.detail
          || `HTTP ${response.status}`;

        throw new Error(detail);
      }

      return data;
    }

    function renderQueue(data) {
      const items =
        data.items || [];

      if (!items.length) {
        queueEl.innerHTML = `
          <div class="empty">
            No ${escapeHtml(
              statusFilter.value
            )} review items.
          </div>
        `;

        return;
      }

      queueEl.innerHTML =
        items.map((item) => `
          <button
            class="queue-card ${
              item.id === currentReviewId
                ? "active"
                : ""
            }"
            data-review-id="${
              escapeHtml(item.id)
            }"
          >
            <div class="queue-card-top">
              <span class="reason">
                ${escapeHtml(
                  item.queue_reason
                )}
              </span>

              <span class="priority">
                P${escapeHtml(
                  item.priority
                )}
              </span>
            </div>

            <div class="field">
              ${escapeHtml(
                item.field
              )}
            </div>

            <div class="auto">
              ${escapeHtml(
                item.automatic_tier
              )}
              ${
                item.automatic_value
                  ? " ? "
                    + escapeHtml(
                      item.automatic_value
                    )
                  : ""
              }
            </div>
          </button>
        `).join("");

      queueEl
        .querySelectorAll(
          "[data-review-id]"
        )
        .forEach((button) => {
          button.addEventListener(
            "click",
            () => {
              selectReview(
                button.dataset.reviewId
              );
            }
          );
        });
    }

    async function loadQueue() {
      try {
        const status =
          encodeURIComponent(
            statusFilter.value
          );

        const data =
          await api(
            `/api/reviews?status=${status}&limit=100`
          );

        renderQueue(data);

      } catch (error) {
        queueEl.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function voteRows(votes) {
      if (!votes.length) {
        return `
          <tr>
            <td colspan="5">
              No evaluator judgments.
            </td>
          </tr>
        `;
      }

      return votes.map(
        (vote) => `
          <tr>
            <td>
              ${escapeHtml(
                vote.evaluator_family
              )}
            </td>
            <td>
              ${escapeHtml(
                vote.evaluator_id
              )}
            </td>
            <td>
              ${escapeHtml(
                vote.value
              )}
            </td>
            <td>
              ${escapeHtml(
                formatValue(
                  vote.confidence
                )
              )}
            </td>
            <td>
              ${escapeHtml(
                vote.basis_class
              )}
            </td>
          </tr>
        `
      ).join("");
    }

    function resolutionPanel(data) {
      const review =
        data.review;

      if (review.status !== "pending") {
        return `
          <div class="section">
            <div class="eyebrow">
              Human resolution
            </div>

            <div class="resolved">
              Resolved
            </div>

            <div class="meta-grid">
              <div class="meta">
                <div class="meta-label">
                  Value
                </div>
                <div class="meta-value">
                  ${escapeHtml(
                    review.resolution_value
                  )}
                </div>
              </div>

              <div class="meta">
                <div class="meta-label">
                  Reviewer
                </div>
                <div class="meta-value">
                  ${escapeHtml(
                    review.reviewed_by
                  )}
                </div>
              </div>

              <div class="meta">
                <div class="meta-label">
                  Reviewed at
                </div>
                <div class="meta-value">
                  ${escapeHtml(
                    review.reviewed_at
                  )}
                </div>
              </div>
            </div>

            <p>
              ${escapeHtml(
                review.resolution_reason
              )}
            </p>
          </div>
        `;
      }

      const options =
        (data.suggested_values || [])
          .map(
            (value) => `
              <option value="${
                escapeHtml(value)
              }"></option>
            `
          )
          .join("");

      return `
        <div class="section">
          <div class="eyebrow">
            Human resolution
          </div>

          <h3>
            Resolve this field
          </h3>

          <div class="form-grid">
            <div class="form-control">
              <label for="resolutionValue">
                Correct value
              </label>

              <input
                id="resolutionValue"
                list="suggestedValues"
                value="${
                  escapeHtml(
                    review.automatic_value
                  )
                }"
              />

              <datalist id="suggestedValues">
                ${options}
              </datalist>
            </div>

            <div class="form-control">
              <label for="reviewerName">
                Reviewer
              </label>

              <input
                id="reviewerName"
                value="Yuvraj"
              />
            </div>

            <div class="form-control">
              <label for="resolutionScope">
                Scope
              </label>

              <select id="resolutionScope">
                <option value="case_only">
                  Case only
                </option>

                <option value="pattern_candidate">
                  Pattern candidate
                </option>

                <option value="entity_mapping_candidate">
                  Entity mapping candidate
                </option>

                <option value="global_rule_candidate">
                  Global rule candidate
                </option>
              </select>
            </div>
          </div>

          <div class="form-control">
            <label for="resolutionReason">
              Reason
            </label>

            <textarea
              id="resolutionReason"
              placeholder="Explain why this value is correct for this exact claim/evidence case."
            ></textarea>
          </div>

          <div style="margin-top: 12px;">
            <button
              class="resolve-button"
              id="resolveButton"
            >
              Save human resolution
            </button>
          </div>

          <div
            id="resolveMessage"
            style="margin-top: 10px;"
          ></div>
        </div>
      `;
    }

    function renderDetail(data) {
      const review =
        data.review;

      const claim =
        data.claim;

      const evidence =
        data.evidence;

      contentEl.innerHTML = `
        <div class="section">
          <div class="eyebrow">
            ${escapeHtml(
              review.queue_reason
            )}
            ? priority
            ${escapeHtml(
              review.priority
            )}
          </div>

          <div class="claim">
            ${escapeHtml(
              claim.canonical_text
            )}
          </div>

          <div class="meta-grid">
            <div class="meta">
              <div class="meta-label">
                Field
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  review.field
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                Automatic tier
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  review.automatic_tier
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                Automatic value
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  formatValue(
                    review.automatic_value
                  )
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                Subject
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  claim.subject_key
                )}
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="eyebrow">
            Evaluator votes
          </div>

          <table>
            <thead>
              <tr>
                <th>Family</th>
                <th>Evaluator</th>
                <th>Value</th>
                <th>Confidence</th>
                <th>Basis</th>
              </tr>
            </thead>

            <tbody>
              ${voteRows(
                data.votes || []
              )}
            </tbody>
          </table>
        </div>

        <div class="section">
          <div class="eyebrow">
            Evidence
          </div>

          <div class="meta-grid">
            <div class="meta">
              <div class="meta-label">
                Type
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  evidence.evidence_type
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                Verification
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  evidence.verification_status
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                Observed
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  evidence.observed_at
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                URL
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  formatValue(
                    evidence.canonical_url
                  )
                )}
              </div>
            </div>

            <div class="meta">
              <div class="meta-label">
                Reference
              </div>
              <div class="meta-value">
                ${escapeHtml(
                  evidence.reference_key
                )}
              </div>
            </div>
          </div>

          <details style="margin-top: 16px;">
            <summary>
              Evidence lineage JSON
            </summary>

            <pre>${escapeHtml(
              JSON.stringify(
                evidence.metadata,
                null,
                2
              )
            )}</pre>
          </details>
        </div>

        ${resolutionPanel(data)}
      `;

      const resolveButton =
        document.getElementById(
          "resolveButton"
        );

      if (resolveButton) {
        resolveButton.addEventListener(
          "click",
          () => resolveCurrent()
        );
      }
    }

    async function selectReview(reviewId) {
      currentReviewId = reviewId;

      try {
        const data =
          await api(
            `/api/reviews/${
              encodeURIComponent(
                reviewId
              )
            }`
          );

        renderDetail(data);

        await loadQueue();

      } catch (error) {
        contentEl.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    async function resolveCurrent() {
      if (!currentReviewId) {
        return;
      }

      const value =
        document.getElementById(
          "resolutionValue"
        ).value.trim();

      const reason =
        document.getElementById(
          "resolutionReason"
        ).value.trim();

      const correctedBy =
        document.getElementById(
          "reviewerName"
        ).value.trim();

      const scope =
        document.getElementById(
          "resolutionScope"
        ).value;

      const message =
        document.getElementById(
          "resolveMessage"
        );

      if (!value || !reason || !correctedBy) {
        message.className = "error";
        message.textContent =
          "Value, reviewer, and reason are required.";
        return;
      }

      try {
        const result =
          await api(
            `/api/reviews/${
              encodeURIComponent(
                currentReviewId
              )
            }/resolve`,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",

                "X-Sportabase-Reviewer-Token":
                  REVIEW_TOKEN
              },
              body: JSON.stringify({
                value,
                reason,
                corrected_by: correctedBy,
                scope
              })
            }
          );

        renderDetail(
          result.item
        );

        await loadQueue();

      } catch (error) {
        message.className = "error";
        message.textContent =
          error.message;
      }
    }

    refreshButton.addEventListener(
      "click",
      () => loadQueue()
    );

    statusFilter.addEventListener(
      "change",
      () => {
        currentReviewId = null;

        contentEl.innerHTML = `
          <div class="empty">
            Select a review item.
          </div>
        `;

        loadQueue();
      }
    );

    loadQueue();
  </script>
</body>
</html>
